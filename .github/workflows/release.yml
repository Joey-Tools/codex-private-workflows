name: Private Overlay Release

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".agents/**"
      - ".github/workflows/**"
      - "README.md"
      - "personal_codex/**"
      - "private-overlay-source-lock.json"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: private-overlay-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build private overlay release
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-slim' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 30 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check helper syntax without bytecode
        if: github.event_name != 'pull_request'
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py \
            scripts/private_overlay_release.py \
            scripts/private_overlay_source_lock.py \
            scripts/sync_private_overlay_sources.py \
            tests/test_package_builder_safety.py \
            tests/test_personal_sync_reconciliation_safety.py \
            tests/test_private_overlay_package.py \
            tests/test_private_overlay_source_lock.py \
            tests/test_private_overlay_sync.py \
            tests/test_release_manifest_baseline.py \
            tests/test_sync_manifest_changes.py

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: python3 -m unittest discover -s tests

      - name: Validate sync manifest changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/validate_sync_manifest_changes.py \
            --base-ref "$BASE_REF"

      - name: Validate release history
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validate_sync_manifest_changes.py \
            --release-repo "$GITHUB_REPOSITORY"

      - name: Verify canonical review workflow
        if: github.event_name != 'pull_request'
        run: |
          python3 -m unittest discover \
            -s personal_codex/skills/review-orchestration-playbook/tests \
            -p 'test_*.py'

      - name: Build release package
        run: |
          python3 scripts/build_personal_codex_package.py \
            --sha "$GITHUB_SHA" \
            --require-clean-sources \
            --output-dir dist

      - name: Verify release package
        run: |
          python3 scripts/private_overlay_release.py verify-package \
            --sha "$GITHUB_SHA" \
            --dist dist

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  publish:
    name: Publish private overlay release
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release package
        run: |
          python3 scripts/build_personal_codex_package.py \
            --sha "$GITHUB_SHA" \
            --require-clean-sources \
            --output-dir dist

      - name: Verify release package
        run: |
          python3 scripts/private_overlay_release.py verify-package \
            --sha "$GITHUB_SHA" \
            --dist dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          python3 scripts/private_overlay_release.py publish \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --dist dist \
            --source-event "$GITHUB_EVENT_NAME"

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'
