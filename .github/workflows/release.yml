name: Private Overlay Release

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".agents/**"
      - ".github/workflows/**"
      - "README.md"
      - "personal_codex/**"
      - "private-overlay-source-lock.json"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: private-overlay-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controller_python_39:
    name: controller-compatibility (python-3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Check controller syntax without bytecode
        run: |
          python3 -B -c 'import pathlib; path = pathlib.Path("personal_codex/bin/codex-private-macos-sync"); compile(path.read_bytes(), str(path), "exec")'

      - name: Run controller compatibility tests
        run: python3 -m unittest tests.test_private_macos_sync_controller

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  controller_macos:
    name: controller-platform (macos, python-3.13)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check controller syntax without bytecode
        run: |
          python3 -B -c 'import pathlib; path = pathlib.Path("personal_codex/bin/codex-private-macos-sync"); compile(path.read_bytes(), str(path), "exec")'

      - name: Run controller platform tests
        run: python3 -m unittest tests.test_private_macos_sync_controller

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  release_tests:
    name: release-tests (${{ matrix.suite }}, group ${{ matrix.group }}/4)
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        suite: [overlay, review]
        group: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run release test group
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          python3 -B scripts/run_release_test_group.py "$TEST_SUITE" \
            --group-index "$TEST_GROUP" --group-count 4

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  manifest_validation:
    name: Validate private overlay release history
    if: ${{ github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate sync manifest changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validate_sync_manifest_changes.py \
            --release-repo "$GITHUB_REPOSITORY"

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  release:
    name: Build private overlay release
    needs:
      - controller_python_39
      - controller_macos
      - release_tests
      - manifest_validation
    if: ${{ always() && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require release validation checks to pass
        env:
          PYTHON_39_RESULT: ${{ needs.controller_python_39.result }}
          MACOS_CONTROLLER_RESULT: ${{ needs.controller_macos.result }}
          RELEASE_TEST_RESULT: ${{ needs.release_tests.result }}
          MANIFEST_RESULT: ${{ needs.manifest_validation.result }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          test "$PYTHON_39_RESULT" = "success"
          test "$MACOS_CONTROLLER_RESULT" = "success"
          test "$MANIFEST_RESULT" = "success"
          if [[ "$RELEASE_EVENT" == "pull_request" ]]; then
            test "$RELEASE_TEST_RESULT" = "skipped"
          else
            test "$RELEASE_TEST_RESULT" = "success"
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check helper syntax without bytecode
        if: github.event_name != 'pull_request'
        run: |
          python3 -B -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]' \
            scripts/codex_personal_sync.py \
            scripts/build_personal_codex_package.py \
            scripts/validate_sync_manifest_changes.py \
            scripts/private_overlay_release.py \
            scripts/private_overlay_source_lock.py \
            scripts/sync_private_overlay_sources.py \
            scripts/run_release_test_group.py \
            tests/test_package_builder_safety.py \
            tests/test_personal_sync_reconciliation_safety.py \
            tests/test_private_overlay_package.py \
            tests/test_private_overlay_source_lock.py \
            tests/test_private_overlay_sync.py \
            tests/test_release_manifest_baseline.py \
            tests/test_sync_manifest_changes.py

      - name: Build release package
        run: |
          python3 scripts/build_personal_codex_package.py \
            --sha "$GITHUB_SHA" \
            --require-clean-sources \
            --output-dir dist

      - name: Verify release package
        run: |
          python3 scripts/private_overlay_release.py verify-package \
            --sha "$GITHUB_SHA" \
            --dist dist

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'

  publish:
    name: Publish private overlay release
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release package
        run: |
          python3 scripts/build_personal_codex_package.py \
            --sha "$GITHUB_SHA" \
            --require-clean-sources \
            --output-dir dist

      - name: Verify release package
        run: |
          python3 scripts/private_overlay_release.py verify-package \
            --sha "$GITHUB_SHA" \
            --dist dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          python3 scripts/private_overlay_release.py publish \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --dist dist \
            --source-event "$GITHUB_EVENT_NAME"

      - name: Require source-only Python tree
        if: always()
        run: |
          python3 -B -c 'import pathlib, sys; artifacts = [str(path) for path in pathlib.Path(".").rglob("*") if path.name == "__pycache__" or path.suffix in {".pyc", ".pyo"}][:20]; sys.exit("bytecode artifacts: " + ", ".join(artifacts)) if artifacts else None'
